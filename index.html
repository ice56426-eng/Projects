<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra AI & PixelBeasts Portal</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --panel-bg: rgba(16, 16, 28, 0.7);
            --primary-glow: #a855f7;
            --accent-glow: #e879f9;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(232, 121, 249, 0.15) 0%, transparent 40%);
        }

        /* Sci-fi Grid Background Effect */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            text-align: center;
            z-index: 1;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
        }

        .portal-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px 30px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Custom glow matching specific cards */
        .card-ultra {
            --card-glow: var(--primary-glow);
            box-shadow: inset 0 0 15px rgba(168, 85, 247, 0.05);
        }

        .card-beasts {
            --card-glow: var(--accent-glow);
            box-shadow: inset 0 0 15px rgba(232, 121, 249, 0.05);
        }

        .portal-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--card-glow) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .portal-card:hover {
            transform: translateY(-8px);
            border-color: var(--card-glow);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(var(--card-glow), 0.2);
        }

        .portal-card:hover::before {
            opacity: 0.12;
        }

        .icon-container {
            width: 70px;
            height: 70px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .portal-card:hover .icon-container {
            border-color: var(--card-glow);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 15px var(--card-glow);
        }

        .icon-container svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 2;
            transition: stroke 0.4s ease;
        }

        .portal-card:hover .icon-container svg {
            stroke: var(--card-glow);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .portal-card:hover .card-title {
            color: var(--card-glow);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .card-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .portal-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Interface Control</h1>
            <p>Select Deployment Module</p>
        </header>

        <div class="portal-grid">
            
            <!-- Ultra AI Card -->
            <a href="https://ice56426-eng.github.io/Airglasstry3/" class="portal-card card-ultra">
                <span class="card-tag">SYSTEM CORE</span>
                <div class="icon-container">
                    <!-- Futuristic Hexagon/HUD Icon -->
                    <svg viewBox="0 0 24 24">
                        <polygon points="12 2 22 7 22 17 12 22 2 17 2 7" />
                        <polyline points="12 22 12 12 22 7" />
                        <polyline points="12 12 2 7" />
                    </svg>
                </div>
                <div class="card-title">Ultra AI</div>
                <div class="card-desc">Initialize advanced HUD network, spatial telemetry, and hologram controls.</div>
            </a>

            <!-- PixelBeasts Card -->
            <a href="https://ice56426-eng.github.io/PixelBeasts4/" class="portal-card card-beasts">
                <span class="card-tag">SIMULATION</span>
                <div class="icon-container">
                    <!-- Gaming/D-Pad Retro Icon -->
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="4" />
                        <path d="M6 12h4M8 10v4M15 11h.01M18 13h.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
                    </svg>
                </div>
                <div class="card-title">PixelBeasts Game</div>
                <div class="card-desc">Launch ecosystem simulation grid and control dynamic engine layers.</div>
            </a>

        </div>
    </div>

</body>
</html>
